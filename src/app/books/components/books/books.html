<div class="books-container">
    <h1>Books</h1>

    <div class="toolbar">
        <input #searchInput type="text" placeholder="Search..."
        (keyup.enter)="search(searchInput.value)" autofocus>
        <button (click)="createNewBook()">Create new book</button>
    </div>

    <app-book-list [books]="filteredBooks" [searchTerm]="searchTerm" (deleteBook)="handleDelete($event)">
        
    </app-book-list>
</div>
