@if (book$ | async; as book) {

  <div class="page-header">
    <a routerLink="/books" class="back-link">
      <mat-icon>arrow_back_ios</mat-icon>
      <span>All books</span>
    </a>
    <h1>{{ book.name }}</h1>
    <div class="placeholder"></div>
  </div>

  @if ((paginatedPages$ | async)?.length) {
    <div class="pages-grid">
      @for (page of (paginatedPages$ | async); track page) {
        <a [routerLink]="['/page-detail', book.id, page]">
          <div class="page-square">
            <span class="page-number">{{ page }}</span>
          </div>
        </a>
      }
    </div>
  } @else {
    <p>This book has no pages or they are loading...</p>
  }
  
  <mat-paginator
    [length]="(totalPages$ | async) ?? 0"
    [pageSize]="(pagination$ | async)!.pageSize"
    [pageIndex]="(pagination$ | async)!.pageIndex"
    (page)="onPageChange($event)"
    [hidePageSize]="true"
    [showFirstLastButtons]="false"
    aria-label="Select page">
  </mat-paginator>

} @else {
  <p>Loading book information...</p>
}
