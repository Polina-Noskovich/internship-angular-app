<div class="books-container">
  <h1>Books</h1>

  <div class="toolbar">
    <input
      #searchInput
      type="text"
      placeholder="Search..."
      (input)="onSearchInput(searchInput.value)"
      appAutofocus
    />
    <button class="create-button" (click)="createNewBook()">Create new book</button>
  </div>

  <app-book-list
    [books]="filteredBooks()"
    [searchValue]="searchText()"
    (deleteBook)="onDelete($event)"
  >
  </app-book-list>
</div>
