<table class="books-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Size</th>
            <th>Created at</th>
            <th>Pages</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
            @for (book of books; track book.id) {
                <tr [routerLink]="['/books', book.id, 'pages']">
                    <td [innerHTML]="book.id + '. ' + book.name | highlight : searchTerm"></td>
                    <td [innerHTML]="book.type | highlight : searchTerm : '#fff3cd'"></td>
                    <td>{{ book.size }}</td>
                    <td>{{ book.createdAt | date: 'dd.MM.yyyy' }}</td>
                    <td>{{ book.pages }}</td>
                    <td class="action-cell">
                        <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                        <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="onDelete(book.id)">
                                <mat-icon>delete</mat-icon>
                                <span>Delete</span>
                            </button>
                        </mat-menu>
                    </td>
                </tr>
            }
            @empty {
                <tr>
                    <td colspan="6">Not found :(</td>
                </tr>
            }
    </tbody>
</table>
